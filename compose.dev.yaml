# Local development: only PostgreSQL and Redis, reachable from the host.
# docker compose -f compose.dev.yaml up -d, then run the panel with uv (see README).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lamnezia
      POSTGRES_USER: lamnezia
      POSTGRES_PASSWORD: lamnezia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres-dev-data:
