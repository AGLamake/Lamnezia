name: Wiki

# Publishes docs/wiki of the releases branch to the GitHub Wiki, so it describes the released
# version. The wiki must exist: create its first page by hand once
# (Settings → Features → Wikis, then the Wiki tab), see docs/wiki/en/Development.md.
on:
  push:
    branches: [releases]
    paths:
      - docs/wiki/**
      - docs/ARCHITECTURE.md
      - docs/CODE_STYLE.md
      - scripts/publish_wiki.py
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - run: python3 scripts/publish_wiki.py --out wiki --ref "${GITHUB_REF_NAME}"
      - name: Push the pages
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git commit -m "Update wiki from ${GITHUB_SHA::7}"
          git push
