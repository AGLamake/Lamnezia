name: Release

# A tag vX.Y.Z publishes the image (amd64 and arm64) to GHCR and a GitHub release with notes from CHANGELOG.md.
# The image, its SBOM and the release files get signed attestations: `gh attestation verify` checks them.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag against pyproject.toml
        run: |
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PROJECT_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag v$VERSION does not match version $PROJECT_VERSION in pyproject.toml"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v header="## [$VERSION]" '
            /^## \[/ { found = index($0, header) == 1; next }
            /^\[[^]]+\]: / { found = 0 }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section [$VERSION]"
            exit 1
          fi

      # arm64 is built under QEMU emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-releases (v1.0.0-rc.1) get only their exact tag; releases also move X.Y, X and latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR names are lower case; the attestations name the image by its digest.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      # The update from the panel (deploy/update/lamnezia-deploy.sh release) takes only a tag whose
      # commit, and image digest for a ready-image install, match this file of the release.
      - name: Release manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'commit %s\nimage %s\n' "$GITHUB_SHA" "$DIGEST" > "$RUNNER_TEMP/lamnezia-release.txt"

      - name: Source archive
        run: git archive --format=tar.gz --prefix="lamnezia-$VERSION/" -o "$RUNNER_TEMP/lamnezia-$VERSION.tar.gz" "$GITHUB_SHA"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/lamnezia-${{ env.VERSION }}.tar.gz
            ${{ runner.temp }}/lamnezia-release.txt

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE \
            "$RUNNER_TEMP/lamnezia-release.txt" "$RUNNER_TEMP/lamnezia-$VERSION.tar.gz"
