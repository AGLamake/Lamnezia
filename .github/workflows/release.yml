name: Release

# A tag vX.Y.Z publishes the image (amd64 and arm64) to GHCR and a GitHub release with notes from CHANGELOG.md.
# The image, its SBOM and the release files get signed attestations: `gh attestation verify` checks them.
# The release manifest is also signed with the SSH key in the RELEASE_SIGNING_KEY secret; the host
# checks it against deploy/update/release-signers before an update from the panel.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check tag against pyproject.toml
        run: |
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PROJECT_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag v$VERSION does not match version $PROJECT_VERSION in pyproject.toml"
            exit 1
          fi

      # Checked before anything is published: a release the hosts cannot verify is not made.
      - name: Check the signing key
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is not set"
            exit 1
          fi
          if ! grep -q '^[^#[:space:]]' deploy/update/release-signers; then
            echo "::error::deploy/update/release-signers has no key"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v header="## [$VERSION]" '
            /^## \[/ { found = index($0, header) == 1; next }
            /^\[[^]]+\]: / { found = 0 }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section [$VERSION]"
            exit 1
          fi

      # arm64 is built under QEMU emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-releases (v1.0.0-rc.1) get only their exact tag; releases also move X.Y, X and latest.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR names are lower case; the attestations name the image by its digest.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      # The update from the panel (deploy/update/lamnezia-deploy.sh release) takes only a tag whose
      # version, commit, and image digest for a ready-image install, match this file of the release.
      - name: Release manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'version v%s\ncommit %s\nimage %s\n' "$VERSION" "$GITHUB_SHA" "$DIGEST" \
            > "$RUNNER_TEMP/lamnezia-release.txt"

      # The signature is checked here the way the hosts check it, so a key that does not match
      # release-signers stops the release.
      - name: Sign the release manifest
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/release-signing-key"
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          ssh-keygen -Y sign -q -f "$key" -n lamnezia-release "$RUNNER_TEMP/lamnezia-release.txt"
          rm -f "$key"
          ssh-keygen -Y verify -f deploy/update/release-signers -I lamnezia-release -n lamnezia-release \
            -s "$RUNNER_TEMP/lamnezia-release.txt.sig" < "$RUNNER_TEMP/lamnezia-release.txt"

      - name: Source archive
        run: git archive --format=tar.gz --prefix="lamnezia-$VERSION/" -o "$RUNNER_TEMP/lamnezia-$VERSION.tar.gz" "$GITHUB_SHA"

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            ${{ runner.temp }}/lamnezia-${{ env.VERSION }}.tar.gz
            ${{ runner.temp }}/lamnezia-release.txt

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE \
            "$RUNNER_TEMP/lamnezia-release.txt" "$RUNNER_TEMP/lamnezia-release.txt.sig" \
            "$RUNNER_TEMP/lamnezia-$VERSION.tar.gz"
