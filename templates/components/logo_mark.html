{# Lamnezia mark; the L and the keyhole follow the theme. Usage: include with uid="side" size="h-8". #}
{# `uid` prefixes the gradient ids: give each copy on a page its own. Files: static/brand/. #}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="688 176 708 406" aria-hidden="true"
     class="{{ size|default:'h-7' }} w-auto shrink-0">
  <defs>
    <linearGradient id="{{ uid }}c" gradientUnits="userSpaceOnUse" x1="1084" y1="182" x2="990" y2="431">
      <stop offset="0" stop-color="#00c0fe"/><stop offset="1" stop-color="#0347f8"/>
    </linearGradient>
    <linearGradient id="{{ uid }}t" gradientUnits="userSpaceOnUse" x1="1200" y1="460" x2="1339" y2="529">
      <stop offset="0" stop-color="#0050fc"/><stop offset="1" stop-color="#0094ff"/>
    </linearGradient>
    <linearGradient id="{{ uid }}o" gradientUnits="userSpaceOnUse" x1="695" y1="520" x2="1385" y2="290">
      <stop offset="0" stop-color="#0160ff"/><stop offset=".45" stop-color="#00dcff"/><stop offset="1" stop-color="#10a8fe"/>
    </linearGradient>
  </defs>
  {# Orbit first: its left tail passes behind the L. #}
  <path fill="url(#{{ uid }}o)" d="M905 325.2A368.2 120.1 -20.1 1 0 1186.1 237.9A303.1 105.5 -20.6 1 1 905 325.2Z"/>
  <polygon fill="url(#{{ uid }}c)" points="962,340 1084,182 1234,378 1188,408 1084,272 962,431"/>
  <polygon fill="url(#{{ uid }}t)" points="1102,529 1270,437 1339,529"/>
  <g class="fill-slate-900 dark:fill-slate-100">
    <polygon points="866,268 940,219 940,450 1098,450 978,500 866,500"/>
    <circle cx="1084" cy="359" r="25.5"/>
    <polygon points="1071,380 1097,380 1109,430 1059,430"/>
  </g>
</svg>
