{% load i18n %}{# The main link of a letter as a button, repeated as text for clients that hide buttons. Usage: include with link=… action=… #}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0 8px;">
  <tr><td style="border-radius:8px;background:#1f5fe0;">
    <a href="{{ link }}" style="display:inline-block;padding:12px 22px;color:#ffffff;font-weight:600;text-decoration:none;border-radius:8px;">{{ action }}</a>
  </td></tr>
</table>
<p style="margin:16px 0 0;font-size:13px;color:#4f5b6e;">{% translate "If the button does not work, open this link:" %}<br><a href="{{ link }}" style="color:#1f5fe0;word-break:break-all;">{{ link }}</a></p>
