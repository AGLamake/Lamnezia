#cloud-config
# Lamnezia on a new Debian/Ubuntu server, installed without questions on its first boot.
# Paste into the "user data" field of the hosting provider and set the variables below.
# The domain's DNS A record must point to the server's address before the boot. Without
# LAMNEZIA_DOMAIN the panel opens by the server's IP address (bundled Caddy, no nginx).
#
# The result (panel address, administrator, generated password) is written to
# /opt/lamnezia/install-summary.txt, readable by root only; the install log is in
# /var/log/cloud-init-output.log. The first sign-in asks for a new password; then delete the summary.

runcmd:
  - - bash
    - -c
    - >-
      curl -fsSL https://raw.githubusercontent.com/AGLamake/Lamnezia/releases/install.sh |
      LAMNEZIA_DOMAIN=panel.example.com
      LAMNEZIA_EMAIL=admin@example.com
      LAMNEZIA_IMAGE=latest
      LAMNEZIA_ADMIN_USERNAME=admin
      bash
  # Optional: LAMNEZIA_PROXY=nginx|caddy (caddy without nginx on the server),
  # LAMNEZIA_REF=dev or a tag v1.2.0 to install another branch or version,
  # LAMNEZIA_DIR=/srv/lamnezia for another installation directory.
