# nginx site for Lamnezia on a host that already runs nginx.
# 1. Replace panel.example.com with LAMNEZIA_DOMAIN and the port with the one in LAMNEZIA_HTTP_BIND.
# 2. Copy to /etc/nginx/sites-available/lamnezia and link it into sites-enabled.
# 3. nginx -t && systemctl reload nginx, then certbot --nginx -d panel.example.com adds HTTPS.

map $http_upgrade $lamnezia_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    client_max_body_size 20m;

    # The Telegram webhook (LAMNEZIA_TELEGRAM_WEBHOOK): the bots service, published on 127.0.0.1:8081
    # by compose.override.yaml (docs/wiki Messengers).
    location /bots/telegram/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django trusts this header to know the request came over HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (/ws/...): live operation progress and support chat.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lamnezia_connection_upgrade;
        proxy_read_timeout 1h;
    }
}
