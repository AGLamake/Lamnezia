[project]
name = "lamnezia"
version = "1.0.0"
description = "Self-hosted web panel for Amnezia VPN servers"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.5",
    "channels>=4.2",
    "channels-redis>=4.2",
    "cryptography>=44",
    "django-environ>=0.12",
    "django>=5.2,<5.3",
    "gunicorn>=23",
    "paramiko>=3.5",
    "psycopg[binary]>=3.2",
    "redis>=5",
    "segno>=1.6",
    "uvicorn-worker>=0.3",
    "uvicorn[standard]>=0.34",
    "whitenoise>=6.9",
    "markdown>=3.7",
    "nh3>=0.2.20",
    "django-otp>=1.6",
    "django-axes[ipware]>=8.0",
    "aiogram>=3.20",
    "discord-py>=2.5",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "daphne>=4.2.3",
    "django-stubs[compatible-mypy]>=5.2",
    "factory-boy>=3.3",
    "mypy>=1.15",
    "playwright>=1.48",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "pytest-django>=4.10",
    "ruff>=0.11",
    "types-channels>=4.3.0.20260518",
    "types-markdown>=3.11.2.20261029",
    "types-paramiko>=5.1.0.20261030",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C90", "DJ", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*", "django_otp.*"]
ignore_missing_imports = true

# factory_boy ships incomplete type hints; treat it as untyped.
[[tool.mypy.overrides]]
module = ["factory.*"]
follow_imports = "skip"

# Test factories subclass factory_boy classes.
[[tool.mypy.overrides]]
module = ["apps.*.tests.*"]
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "config.settings_test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["apps", "amnezia_core", "config", "scripts", "examples"]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a real sshd container (LAMNEZIA_TEST_SSH_* variables)"]

# Coverage gate for the Amnezia formats package (make coverage).
[tool.coverage.run]
source = ["amnezia_core"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
